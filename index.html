<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Sinh Nhật!</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
    
    <style>
        /* Định nghĩa màu Vàng Kim */
        :root {
            --gold-color: #FFD700;
            --light-gold: #fde_78_9;
            --off-white: #f5f5f5;
        }

        body {
            font-family: 'Playfair Display', serif; 
            background: linear-gradient(135deg, #232526 0%, #414345 100%); 
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--off-white);
            text-align: center;
            overflow-x: hidden;
        }
        
        .birthday-card {
            background: rgba(0, 0, 0, 0.25); 
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            animation: fadeIn 1s ease-in;
            border: 2px solid rgba(255, 215, 0, 0.5); 
        }
        
        h1 {
            font-family: 'Dancing Script', cursive; 
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            color: var(--gold-color); 
        }
        
        .message {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 30px;
            font-style: italic;
            color: var(--off-white);
        }

        /* === PHẦN CSS CHO BÓNG BAY ĐÃ BỊ XÓA === */

        /* CSS MỚI: Dành cho ảnh bạn chèn vào */
        .birthday-image {
            width: 80%; /* Chiếm 80% chiều rộng thiệp */
            max-width: 300px; /* Giới hạn kích thước tối đa */
            border-radius: 15px; /* Bo góc */
            border: 2px solid var(--gold-color); /* Viền vàng đồng bộ */
            margin: 20px 0; /* Tạo khoảng cách */
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* === KEYFRAME 'float' CỦA BÓNG BAY ĐÃ BỊ XÓA === */
        
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            animation: confettiFall 5s linear infinite;
            top: -20px;
        }
        
        @keyframes confettiFall {
            0% { transform: translateY(-10vh) rotate(0deg); }
            100% { transform: translateY(110vh) rotate(360deg); }
        }

        .signature p {
            font-family: 'Dancing Script', cursive;
            font-size: 1.5em;
            color: var(--gold-color);
        }

        #playButton {
            background: transparent;
            color: var(--gold-color);
            border: 2px solid var(--gold-color);
            border-radius: 10px;
            padding: 10px 20px;
            font-size: 1em;
            font-family: 'Arial', sans-serif; 
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
            transition: all 0.3s ease;
            font-weight: bold;
        }
        #playButton:hover {
            background: var(--gold-color);
            color: #000;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="birthday-card">
        <h1>🎉 Chúc Mừng Sinh Nhật! ♎</h1>
        
        <img src="link_den_hinh_anh.jpg" alt="Kỷ niệm" class="birthday-image">
        
        <div class="message">
            <p>Chúc bạn một ngày sinh nhật thật rực rỡ và sang trọng!</p>
            <p>🎈 Luôn tỏa sáng, cân bằng và hạnh phúc như chính phong thái của cậu. 🎈</p>
            
            <p style="font-weight: bold; color: var(--gold-color);">
                [BẠN CÓ THỂ GHI THÊM LỜI CHÚC DÀI HƠN Ở ĐÂY]
            </p>
            
            <p>Tận hưởng ngày đặc biệt này nhé! 💝</p>
        </div>
        
        <div class="music-player">
            <button id="playButton">Mở Quà 🎁</button>
        </div>
        
        <audio id="birthdaySong" src="link_den_file_nhac.mp3" loop></audio>

        <div class="signature">
            <p><strong>Gửi từ trái tim ❤️</strong></p>
        </div>
    </div>

    <script>
        // Tạo confetti Vàng & Bạc
        function createConfetti() {
            const colors = ['#FFD700', '#C0C0C0', '#FFFFFF', '#fde_78_9'];
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 5 + 's';
                
                if (Math.random() > 0.5) {
                    confetti.style.width = '5px';
                    confetti.style.height = '15px';
                } else {
                    confetti.style.width = '10px';
                    confetti.style.height = '10px';
                }
                confetti.style.opacity = Math.random() * 0.5 + 0.5;

                document.body.appendChild(confetti);
            }
        }
        
        function setupMusicPlayer() {
            const playButton = document.getElementById('playButton');
            const song = document.getElementById('birthdaySong');
            
            if (playButton && song) {
                playButton.addEventListener('click', function() {
                    if (song.paused) {
                        song.play();
                        playButton.textContent = "Đang phát... 🎵";
                    } else {
                        song.pause();
                        playButton.textContent = "Tạm dừng ⏸️";
                    }
                });
            } else {
                console.log("Không tìm thấy nút hoặc file nhạc.");
            }
        }
        
        window.onload = function() {
            createConfetti();
            setupMusicPlayer(); 
        };
    </script>
</body>
</html>
